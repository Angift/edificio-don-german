name: Encrypt and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'src/index.html'

jobs:
  encrypt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Staticrypt
        run: npm install -g staticrypt

      - name: Encrypt HTML
        run: |
          staticrypt src/index.html --password ${{ secrets.SITE_PASSWORD }} -d ./output
          echo "--- Archivos en output ---"
          ls -la ./output/ 2>/dev/null || echo "carpeta output no existe"
          echo "--- Archivos html en todo el proyecto ---"
          find . -name "*.html" | grep -v node_modules | grep -v ".git"

      - name: Mover archivo encriptado
        run: |
          if [ -f "./output/index.html" ]; then
            cp ./output/index.html ./index.html
            echo "Copiado desde output/index.html"
          elif [ -f "./encrypted/index.html" ]; then
            cp ./encrypted/index.html ./index.html
            echo "Copiado desde encrypted/index.html"
          else
            echo "ERROR: no se encontro el archivo encriptado"
            exit 1
          fi

      - name: Commit encrypted file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Auto-encrypt index.html"
          git push

name: Encrypt and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'src/index.html'

jobs:
  encrypt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Staticrypt
        run: npm install -g staticrypt

      - name: Encrypt HTML
        run: |
          staticrypt src/index.html --password ${{ secrets.SITE_PASSWORD }}
          echo "--- Todo lo generado ---"
          find . -name "*.html" | grep -v node_modules | grep -v ".git"

      - name: Commit encrypted file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto-encrypt index.html"
          git push
